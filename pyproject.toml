[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mazegen"
version = "1.0.0"
description = "A maze generator library for the A-Maze-ing 42 project"
license = { file = "LICENSE.md" }
requires-python = ">=3.10"
authors = [
    { name = "Muhammed Ömer Celep" },
    { name = "Batuhan Fatih Kumcu" },
]
dependencies = []

[project.optional-dependencies]
dev = ["flake8", "mypy", "pytest", "hatch", "build"]

[tool.hatch.build.targets.wheel]
packages = ["mazegen"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
