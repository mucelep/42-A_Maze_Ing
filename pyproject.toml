[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generator (recursive backtracker), BFS solver and hexadecimal wall-encoder"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [
    { name = "Muhammed Ömer Celep" },
    { name = "Batuhan Fatih Kumcu" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

[tool.setuptools]
packages = ["mazegen"]
